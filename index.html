<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CYBERLEEK · Landing Hub</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #00050d;
    --card: #00102b;
    --card-2: #00173d;
    --border: #003299;
    --neon: #0064ec;
    --green: #60c33a;
    --red: #ff3355;
    --gold: #f5c542;
    --cyan: #34d6d6;
    --text: #a0b0c8;
    --text-bright: #d6efc1;
    --text-dim: #6a7a90;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Courier New", "Lucida Console", monospace;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 1.2rem;
    line-height: 1.45;
  }

  body::before {
    content: "";
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 4px,
      rgba(0, 0, 0, 0.04) 4px,
      rgba(0, 0, 0, 0.04) 8px
    );
    pointer-events: none;
    z-index: 9999;
  }

  .wrapper {
    max-width: 1180px;
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    padding: 1.3rem 1.5rem;
    box-shadow: 0 0 40px rgba(0, 100, 236, 0.08);
  }

  .header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.65rem;
    margin-bottom: 1.1rem;
  }

  .header h1 {
    font-size: 1.4rem;
    font-weight: 900;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--neon);
    text-shadow: 0 0 30px rgba(0, 100, 236, 0.25);
  }

  .header .sub {
    font-size: 0.72rem;
    color: var(--text-dim);
    letter-spacing: 1.5px;
    margin-top: 3px;
  }

  .section-label {
    font-size: 0.7rem;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    border-bottom: 1px dashed var(--border);
    padding-bottom: 4px;
    margin-bottom: 0.75rem;
  }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
    gap: 0.85rem;
    margin-bottom: 1.15rem;
  }

  .module-btn-card {
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 1rem 1.1rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 0.55rem;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, transform 0.1s;
  }

  .module-btn-card:hover {
    border-color: var(--neon);
    background: var(--card-2);
  }

  .module-btn-card:active {
    transform: translateY(1px);
  }

  .hub-card {
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 0.95rem 1.05rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 0.75rem;
    transition: border-color 0.15s, background 0.15s;
  }

  .hub-card:hover {
    border-color: var(--neon);
    background: var(--card-2);
  }

  .card-tag {
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    display: inline-block;
    padding: 1px 6px;
    border: 1px solid currentColor;
    border-radius: 3px;
    margin-bottom: 0.45rem;
  }

  .tag-internal { color: var(--green); }
  .tag-external { color: var(--cyan); }
  .tag-future { color: var(--gold); }

  .card-title {
    color: var(--text-bright);
    font-size: 0.96rem;
    font-weight: 700;
    margin-bottom: 0.3rem;
  }

  .card-desc {
    color: var(--text-dim);
    font-size: 0.75rem;
  }

  .card-go {
    color: var(--cyan);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin-top: 0.25rem;
  }

  .card-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    align-items: center;
    padding-top: 0.35rem;
    border-top: 1px dashed var(--border);
  }

  .btn {
    background: var(--card);
    color: var(--text-bright);
    border: 1px solid var(--border);
    padding: 5px 10px;
    font-family: inherit;
    font-size: 0.72rem;
    letter-spacing: 0.5px;
    text-decoration: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
  }

  .btn:hover {
    border-color: var(--neon);
    color: var(--cyan);
    background: var(--card-2);
  }

  .btn.primary {
    border-color: var(--neon);
    background: rgba(0, 100, 236, 0.18);
  }

  .gateway-status {
    font-size: 0.68rem;
    color: var(--gold);
    margin-top: 0.35rem;
  }

  .footer {
    text-align: center;
    font-size: 0.68rem;
    color: var(--text-dim);
    letter-spacing: 2px;
    border-top: 1px solid var(--border);
    padding-top: 0.6rem;
    margin-top: 0.6rem;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="wrapper">
    <header class="header">
      <div>
        <h1>CYBERLEEK · HUB</h1>
        <div class="sub">LANDING PAGE · TIMELINE · MARKET ANALYZER · VIEWER &amp; GATEWAYS</div>
      </div>
    </header>

    <div class="section-label">Core Modules</div>
    <div class="cards-grid" id="coreGrid"></div>

    <div class="section-label">Blockchain Viewer &amp; Gateway Tools</div>
    <div class="cards-grid" id="toolsGrid"></div>

    <div class="section-label" id="extraLabel" style="display:none">Additional Links</div>
    <div class="cards-grid" id="extraGrid" style="display:none"></div>

    <div class="footer">provided by n0ne</div>
  </div>

<script>
/**
 * Future-proof link registry:
 * To add Discord or any new link later, append an object to EXTRA_LINKS:
 * {
 *   id: "discord",
 *   badge: "Community",
 *   badgeClass: "tag-future",
 *   title: "Discord Server",
 *   description: "Community discussion, updates, and announcements.",
 *   href: "https://discord.gg/YOUR_INVITE",
 *   external: true
 * }
 */
const CORE_MODULES = [
  {
    id: "timeline",
    badge: "Chronology",
    badgeClass: "tag-internal",
    title: "Current Timeline",
    description: "Three-column chronological leak timeline across August, October, and November 2026.",
    href: "./timeline.html",
    external: false
  },
  {
    id: "market",
    badge: "Analytics",
    badgeClass: "tag-internal",
    title: "Market Analyzer",
    description: "Market cap chart, 12h/24h/latest impact deltas, top/bottom movers, and CSV export.",
    href: "./market.html",
    external: false
  }
];

const EXTRA_LINKS = [
  // Add future entries here (e.g. Discord invite)
];

const GATEWAY_FINDER_URL = "https://wayfinder.ar.io/?q=cyberleek";
const GITHUB_VIEWER_URL = "https://github.com/Exaxors/cyberleek-viewer";

let gatewayAttemptCount = 0;

function renderModuleButton(item) {
  const targetAttrs = item.external ? ' target="_blank" rel="noopener noreferrer"' : "";
  return `
    <a class="module-btn-card" href="${item.href}"${targetAttrs} data-link-id="${item.id}">
      <div>
        <span class="card-tag ${item.badgeClass || "tag-internal"}">${item.badge || "Module"}</span>
        <div class="card-title">${item.title}</div>
        <div class="card-desc">${item.description}</div>
      </div>
      <div class="card-go">CLICK TO OPEN →</div>
    </a>
  `;
}

function renderExtraCard(item) {
  const targetAttrs = item.external ? ' target="_blank" rel="noopener noreferrer"' : "";
  return `
    <div class="hub-card" data-link-id="${item.id}">
      <div>
        <span class="card-tag ${item.badgeClass || "tag-future"}">${item.badge || "Link"}</span>
        <div class="card-title">${item.title}</div>
        <div class="card-desc">${item.description}</div>
      </div>
      <div class="card-actions">
        <a class="btn primary" href="${item.href}"${targetAttrs}>OPEN →</a>
      </div>
    </div>
  `;
}

function renderBottomEntries() {
  return `
    <div class="hub-card" id="viewerForkCard">
      <div>
        <span class="card-tag tag-external">Fork</span>
        <div class="card-title">Cyberleek Viewer Fork (GitHub Repo)</div>
        <div class="card-desc">
          GitHub repo of my cyberleek viewer fork — updated to support announcements and stuff.
        </div>
      </div>
      <div class="card-actions">
        <a class="btn primary" href="${GITHUB_VIEWER_URL}" target="_blank" rel="noopener noreferrer">
          OPEN GITHUB FORK →
        </a>
      </div>
    </div>

    <div class="hub-card" id="gatewayFinderCard">
      <div>
        <span class="card-tag tag-external">Browser Gateway</span>
        <div class="card-title">Browser Gateway Finder</div>
        <div class="card-desc">
          If you prefer using the browser, use this to find a gateway — if you get a blocked one, just refresh until you get a free one, or as a last resort use my viewer or the outdated original repo.
        </div>
        <div class="gateway-status" id="gatewayStatus"></div>
      </div>
      <div class="card-actions">
        <button type="button" class="btn primary" id="findGatewayBtn">
          FIND GATEWAY →
        </button>
      </div>
    </div>
  `;
}

function mountHub() {
  document.getElementById("coreGrid").innerHTML = CORE_MODULES.map(renderModuleButton).join("");
  document.getElementById("toolsGrid").innerHTML = renderBottomEntries();

  if (Array.isArray(EXTRA_LINKS) && EXTRA_LINKS.length > 0) {
    document.getElementById("extraLabel").style.display = "block";
    const extraEl = document.getElementById("extraGrid");
    extraEl.style.display = "grid";
    extraEl.innerHTML = EXTRA_LINKS.map(renderExtraCard).join("");
  }

  const btn = document.getElementById("findGatewayBtn");
  const statusEl = document.getElementById("gatewayStatus");
  if (btn) {
    btn.addEventListener("click", () => {
      gatewayAttemptCount += 1;
      const cacheBuster = gatewayAttemptCount > 1 ? `&_refresh=${gatewayAttemptCount}` : "";
      const url = `${GATEWAY_FINDER_URL}${cacheBuster}`;
      window.open(url, "_blank", "noopener,noreferrer");
      statusEl.textContent =
        gatewayAttemptCount === 1
          ? "Opened gateway finder in a new tab. If you get a blocked one, refresh until you get a free one."
          : `Opened again (#${gatewayAttemptCount}). Refresh until you get a free gateway.`;
    });
  }
}

mountHub();
</script>
</body>
</html>
