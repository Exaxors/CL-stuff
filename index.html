<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="./icon.ico" type="image/ico" />
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>n0ne's CYBERLEEK · Landing Hub</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #00050d;
    --card: #00102b;
    --card-2: #00173d;
    --border: #003299;
    --neon: #0064ec;
    --green: #60c33a;
    --red: #ff3355;
    --gold: #f5c542;
    --cyan: #34d6d6;
    --text: #a0b0c8;
    --text-bright: #d6efc1;
    --text-dim: #6a7a90;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Courier New", "Lucida Console", monospace;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 0.75rem;
    line-height: 1.35;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 4px,
      rgba(0, 0, 0, 0.04) 4px,
      rgba(0, 0, 0, 0.04) 8px
    );
    pointer-events: none;
    z-index: 9999;
  }

  .wrapper {
    max-width: 1220px;
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    padding: 0.85rem 1.05rem;
    box-shadow: 0 0 40px rgba(0, 100, 236, 0.08);
  }

  .header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.4rem;
    margin-bottom: 0.65rem;
  }

  .header h1 {
    font-size: 1.25rem;
    font-weight: 900;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--neon);
    text-shadow: 0 0 30px rgba(0, 100, 236, 0.25);
  }

  .header .sub {
    font-size: 0.68rem;
    color: var(--text-dim);
    letter-spacing: 1.5px;
    margin-top: 2px;
  }

  .section-label {
    font-size: 0.66rem;
    letter-spacing: 2.2px;
    text-transform: uppercase;
    color: var(--text-dim);
    border-bottom: 1px dashed var(--border);
    padding-bottom: 3px;
    margin-bottom: 0.45rem;
  }

  /* 3-column row for the core modules on desktop/tablet */
  .core-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 0.55rem;
    margin-bottom: 0.7rem;
  }

  /* 2-column grid for viewer & gateway tools */
  .tools-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0.55rem;
    margin-bottom: 0.5rem;
  }

  .extra-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 0.55rem;
    margin-bottom: 0.55rem;
  }

  .module-btn-card {
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 0.6rem 0.75rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 0.3rem;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, transform 0.1s;
    min-width: 0;
  }

  .module-btn-card:hover {
    border-color: var(--neon);
    background: var(--card-2);
  }

  .module-btn-card:active {
    transform: translateY(1px);
  }

  .hub-card {
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 0.62rem 0.78rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 0.4rem;
    transition: border-color 0.15s, background 0.15s;
    min-width: 0;
  }

  .hub-card:hover {
    border-color: var(--neon);
    background: var(--card-2);
  }

  .card-tag {
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    display: inline-block;
    padding: 1px 5px;
    border: 1px solid currentColor;
    border-radius: 3px;
    margin-bottom: 0.2rem;
  }

  .tag-internal { color: var(--green); }
  .tag-external { color: var(--cyan); }
  .tag-future { color: var(--gold); }

  .card-title {
    color: var(--text-bright);
    font-size: 0.88rem;
    font-weight: 700;
    margin-bottom: 0.15rem;
  }

  .card-desc {
    color: var(--text-dim);
    font-size: 0.71rem;
  }

  .card-go {
    color: var(--cyan);
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin-top: 0.1rem;
  }

  .card-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    align-items: center;
    padding-top: 0.28rem;
    border-top: 1px dashed var(--border);
  }

  .btn {
    background: var(--card);
    color: var(--text-bright);
    border: 1px solid var(--border);
    padding: 4px 8px;
    font-family: inherit;
    font-size: 0.68rem;
    letter-spacing: 0.4px;
    text-decoration: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
  }

  .btn:hover {
    border-color: var(--neon);
    color: var(--cyan);
    background: var(--card-2);
  }

  .btn.primary {
    border-color: var(--neon);
    background: rgba(0, 100, 236, 0.18);
  }

  .gateway-status {
    font-size: 0.64rem;
    color: var(--gold);
    margin-top: 0.2rem;
  }

  .footer {
    text-align: center;
    font-size: 0.62rem;
    color: var(--text-dim);
    letter-spacing: 2px;
    border-top: 1px solid var(--border);
    padding-top: 0.4rem;
    margin-top: 0.25rem;
    text-transform: uppercase;
  }

  @media (max-width: 900px) {
    .core-grid {
      grid-template-columns: 1fr;
    }

    .tools-grid {
      grid-template-columns: 1fr;
    }
  }

  @media (max-width: 600px) {
    body {
      display: block;
      padding: 0.55rem;
    }

    .wrapper {
      padding: 0.7rem 0.75rem;
    }

    .header h1 {
      font-size: 1.05rem;
      word-break: break-word;
    }
  }
</style>
</head>
<body>
  <div class="wrapper">
    <header class="header">
      <div>
        <h1>UNOFFICIAL · CYBERLEEK · HUB</h1>
        <div class="sub">LANDING PAGE · TIMELINE · MARKET ANALYZER · GALLERY &amp; GATEWAYS</div>
      </div>
    </header>

    <div class="section-label">Core Modules</div>
    <div class="core-grid" id="coreGrid"></div>

    <div class="section-label">Blockchain Viewer &amp; Gateway Tools</div>
    <div class="tools-grid" id="toolsGrid"></div>

    <div class="section-label" id="extraLabel" style="display:none">Additional Links</div>
    <div class="extra-grid" id="extraGrid" style="display:none"></div>

    <div class="footer">provided by n0ne</div>
  </div>

<script>
/**
 * Future-proof link registry:
 * To add Discord or any new link later, append an object to EXTRA_LINKS:
 * {
 *   id: "discord",
 *   badge: "Community",
 *   badgeClass: "tag-future",
 *   title: "Discord Server",
 *   description: "Community discussion, updates, and announcements.",
 *   href: "https://discord.gg/YOUR_INVITE",
 *   external: true
 * }
 */
const CORE_MODULES = [
  {
    id: "timeline",
    badge: "Chronology",
    badgeClass: "tag-internal",
    title: "Current Timeline",
    description: "Three-column chronological leak timeline across August, October, and November 2026.",
    href: "./timeline.html",
    external: false
  },
  {
    id: "market",
    badge: "Analytics",
    badgeClass: "tag-internal",
    title: "Market Analyzer",
    description: "Market cap chart, 12h/24h/latest impact deltas, top/bottom movers, and CSV export.",
    href: "./market.html",
    external: false
  },
  {
    id: "gallery",
    badge: "Archive",
    badgeClass: "tag-internal",
    title: "Gallery",
    description: "A collection of all watermarks CL used, debunked fakes, and information on how his polls work and so on.",
    href: "./gallery.html",
    external: false
  }
];

const EXTRA_LINKS = [
  // Add future entries here (e.g. Discord invite)
];

const GATEWAY_FINDER_URL = "https://wayfinder.ar.io/?q=cyberleek";
const CONFIRMED_GATEWAY_URL = "https://cyberleek.arj.innostack.xyz";
const GITHUB_VIEWER_URL = "https://github.com/Exaxors/cyberleek-viewer";

let gatewayAttemptCount = 0;

function renderModuleButton(item) {
  const targetAttrs = item.external ? ' target="_blank" rel="noopener noreferrer"' : "";
  return `
    <a class="module-btn-card" href="${item.href}"${targetAttrs} data-link-id="${item.id}">
      <div>
        <span class="card-tag ${item.badgeClass || "tag-internal"}">${item.badge || "Module"}</span>
        <div class="card-title">${item.title}</div>
        <div class="card-desc">${item.description}</div>
      </div>
      <div class="card-go">CLICK TO OPEN →</div>
    </a>
  `;
}

function renderExtraCard(item) {
  const targetAttrs = item.external ? ' target="_blank" rel="noopener noreferrer"' : "";
  return `
    <div class="hub-card" data-link-id="${item.id}">
      <div>
        <span class="card-tag ${item.badgeClass || "tag-future"}">${item.badge || "Link"}</span>
        <div class="card-title">${item.title}</div>
        <div class="card-desc">${item.description}</div>
      </div>
      <div class="card-actions">
        <a class="btn primary" href="${item.href}"${targetAttrs}>OPEN →</a>
      </div>
    </div>
  `;
}

function renderBottomEntries() {
  return `
    <div class="hub-card" id="viewerForkCard">
      <div>
        <span class="card-tag tag-external">Fork</span>
        <div class="card-title">Cyberleek Viewer Fork (GitHub Repo)</div>
        <div class="card-desc">
          GitHub repo of my cyberleek viewer fork — updated to support announcements and stuff.
        </div>
      </div>
      <div class="card-actions">
        <a class="btn primary" href="${GITHUB_VIEWER_URL}" target="_blank" rel="noopener noreferrer">
          OPEN GITHUB FORK →
        </a>
      </div>
    </div>

    <div class="hub-card" id="gatewayFinderCard">
      <div>
        <span class="card-tag tag-external">Browser Gateway</span>
        <div class="card-title">Browser Gateway Finder</div>
        <div class="card-desc">
          If you prefer using the browser, use this to find a gateway — if you get a blocked one, just refresh until you get a free one, or as a last resort use my viewer or the outdated original repo.
        </div>
        <div class="gateway-status" id="gatewayStatus"></div>
      </div>
      <div class="card-actions">
        <button type="button" class="btn primary" id="findGatewayBtn">
          FIND GATEWAY →
        </button>
        <a class="btn" id="confirmedGatewayBtn" href="${CONFIRMED_GATEWAY_URL}" target="_blank" rel="noopener noreferrer">
          confirmed working gateway (checked by me)
        </a>
      </div>
    </div>
  `;
}

function mountHub() {
  try {
    const coreGrid = document.getElementById("coreGrid");
    const toolsGrid = document.getElementById("toolsGrid");

    if (coreGrid) {
      coreGrid.innerHTML = CORE_MODULES.map(renderModuleButton).join("");
    }
    if (toolsGrid) {
      toolsGrid.innerHTML = renderBottomEntries();
    }

    if (Array.isArray(EXTRA_LINKS) && EXTRA_LINKS.length > 0) {
      const extraLabel = document.getElementById("extraLabel");
      const extraEl = document.getElementById("extraGrid");
      if (extraLabel) extraLabel.style.display = "block";
      if (extraEl) {
        extraEl.style.display = "grid";
        extraEl.innerHTML = EXTRA_LINKS.map(renderExtraCard).join("");
      }
    }

    const confirmedBtn = document.getElementById("confirmedGatewayBtn");
    if (confirmedBtn) {
      confirmedBtn.href = CONFIRMED_GATEWAY_URL;
    }

    const btn = document.getElementById("findGatewayBtn");
    const statusEl = document.getElementById("gatewayStatus");
    if (btn) {
      btn.addEventListener("click", () => {
        gatewayAttemptCount += 1;
        const cacheBuster = gatewayAttemptCount > 1 ? `&_refresh=${gatewayAttemptCount}` : "";
        const url = `${GATEWAY_FINDER_URL}${cacheBuster}`;
        window.open(url, "_blank", "noopener,noreferrer");
        if (statusEl) {
          statusEl.textContent =
            gatewayAttemptCount === 1
              ? "Opened gateway finder in a new tab. If you get a blocked one, refresh until you get a free one."
              : `Opened again (#${gatewayAttemptCount}). Refresh until you get a free gateway.`;
        }
      });
    }
  } catch (err) {
    console.error("Failed to mount landing hub:", err);
  }
}

window.addEventListener("DOMContentLoaded", mountHub);
</script>
</body>
</html>
